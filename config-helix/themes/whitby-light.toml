"diagnostic.hint" = { underline = { color = "mid_blue", style = "dotted" } }
"diagnostic.info" = { underline = { color = "mid_blue", style = "dashed" } }
"diagnostic.warning" = { underline = { color = "pale_red", style = "line" } }
"diagnostic.error" = { fg = "black", bg = "pale_red", underline = { color = "red", style = "curl" } }

# Gutter
"warning" = { fg = "dark_sand" }
"error" = { fg = "red" }
"info" = { fg = "gray" }
"hint" = { fg = "blue" }
"diff.plus" = { fg = "green" }
"diff.minus" = { fg = "red" }
"diff.delta" = { fg = "yellow" }

