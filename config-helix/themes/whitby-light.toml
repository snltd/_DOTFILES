# A light theme which reminded me of walking on the beach at Whitby.
# Geared towards Rust and Lisp.
 
# Syntax highlighting
"type" = { fg = "dark_green" }
"type.builtin" = { fg = "dark_green", modifiers = ["italic"] }
# "type.enum" = { fg = "dark_green", modifiers = ["bold"] }
"type.enum.variant" = { fg = "dark_green", modifiers = ["bold"] }
"constant" = { fg = "dark_sand", modifiers = ["bold"] }
"string" = { fg = "mid_blue", modifiers = ["italic"] }
"string.special.symbol" = { fg = "dark_green", modifiers = [] }
"string.path" = { fg = "mid_blue", modifiers = ["underlined"] }
# "string.regexp" = "red"
# "string.special" = "yellow"
"comment" = { fg = "mid_grey", modifiers = ["italic"] }
"comment.block" = { fg = "mid_grey", modifiers = ["italic", "bold"] }
"comment.unused" = { underline = { style = "curl", color = "sand" } }
"variable" = { fg = "dark_sand" }
"variable.other.member" = { fg = "dark_grey" }
"constructor" = "dark_grey"
"variable.builtin" = { fg = "dark_sand", modifiers = ["bold"] }
# "label" = "reduu"
"punctuation" = "black"
"keyword" = "purple"
"keyword.function" = { fg = "dark_blue", modifiers = ["bold"] }
"keyword.control.return" = { bg = "sand" }
"keyword.control.repeat" = { fg = "red" }
# "operator" = "orange"
"function" = { fg = "dark_blue" }
"function.builtin" = { fg = "dark_blue", modifiers = ["bold"] }
"function.macro" = { fg = "dark_blue", modifiers = ["italic", "bold"] }
# "keyword.storage" = "dark_green"
# "keyword.storage.modifier" = { fg = "red", modifiers = ["underlined"] }
# "tag" = "blue"
# "namespace" = "blue"
# # My Ruby Things
# "string.special.symbol" = "green"
# "function.method" = "blue"
# "variable.other.member" = "red"
# "variable.parameter" = "orange"
# "toml.variable.other.member" = "black"

# Interface

"ui.background" = { bg = "paper" }
"ui.bufferline" = { fg = "mid_blue", bg = "dark_blue" }
"ui.bufferline.active" = { fg = "black", bg = "sand" }
"ui.cursor" = { fg = "sand", bg = "mid_blue" }
"ui.cursor.match" = { bg = "pale_blue", fg = "black", modifiers = [
  "slow_blink",
] }
"ui.linenr" = "light_grey"
"ui.linenr.selected" = "dark_grey"
"ui.popup" = { fg = "dark_grey", bg = "sand" }
"ui.window" = { fg = "dark_grey", bg = "sand" }
"ui.help" = { fg = "black", bg = "sand" }
"ui.menu" = { fg = "dark_grey", bg = "sand" }
"ui.menu.selected" = { fg = "pale_blue", bg = "dark_blue" }
"ui.menu.scroll" = { fg = "mid_grey", bg = "dark_grey" }
"ui.selection" = { bg = "pale_blue", fg = "black" }
"ui.statusline" = { fg = "pale_blue", bg = "dark_blue" }
"ui.virtual.indent-guide" = { fg = "light_grey" }
"ui.virtual.ruler" = { bg = "pale_blue" }
